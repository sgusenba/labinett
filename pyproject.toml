[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labinett"
version = "0.1.0"
description = "Auswertung der Nikolo-Glücksscheibe per USB-Webcam"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pyinstaller>=6.5"]

[project.scripts]
labinett = "labinett.__main__:main"

[tool.setuptools]
packages = ["labinett"]

[tool.setuptools.package-data]
labinett = ["static/*", "modelle/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
