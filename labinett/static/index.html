<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>labinett – Nikolo-Auswertung</title>
<style>
  :root { --bg:#f4f1ea; --karte:#fffdf8; --text:#222; --grau:#777; --ok:#1d7a34; --warn:#c46a00; --fehler:#b3261e; --akzent:#1f4e8c; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.4 system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:16px; padding:10px 18px; background:#2a2a2a; color:#fff; }
  header h1 { font-size:18px; margin:0; font-weight:600; }
  header .status { margin-left:auto; font-size:13px; opacity:.85; }
  main { display:grid; grid-template-columns: minmax(320px, 1fr) minmax(380px, 1fr); gap:16px; padding:16px; }
  section { background:var(--karte); border-radius:10px; padding:14px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  h2 { font-size:15px; margin:0 0 10px; }
  #live { width:100%; border-radius:6px; background:#333; min-height:200px; display:block; }
  .leiste { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center; }
  button { font:inherit; padding:8px 14px; border-radius:6px; border:1px solid #bbb; background:#fff; cursor:pointer; }
  button.primaer { background:var(--akzent); color:#fff; border-color:var(--akzent); }
  button:disabled { opacity:.5; cursor:default; }
  .balken { height:6px; background:#ddd; border-radius:3px; overflow:hidden; flex:1; min-width:120px; }
  .balken div { height:100%; background:var(--warn); width:0; transition:width .2s; }
  .leer { color:var(--grau); padding:30px 0; text-align:center; }
  .entwurf { display:grid; grid-template-columns: 1fr 170px; gap:12px; }
  .entwurf img.haupt { width:100%; border-radius:6px; }
  .nummer img { width:160px; border-radius:6px; display:block; }
  .nummer input { width:160px; font-size:28px; text-align:center; margin-top:6px; padding:4px; }
  table { width:100%; border-collapse:collapse; margin-top:10px; }
  th, td { text-align:left; padding:5px 6px; border-bottom:1px solid #eee; }
  td input { width:100%; font:inherit; padding:3px 5px; }
  tr.unsicher td { background:#fff3e0; }
  .gesamt { font-size:26px; font-weight:700; margin:10px 0 4px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; color:#fff; }
  .badge.ok { background:var(--ok); } .badge.pruefen { background:var(--warn); }
  .hinweis { color:var(--warn); font-size:13px; }
  .fehler { color:var(--fehler); }
  details { margin-top:10px; }
  .einst { display:grid; grid-template-columns: 1fr minmax(110px, 260px); gap:6px 10px; align-items:center; margin-top:8px; }
  .einst input { font:inherit; padding:3px 5px; }
  #ergebnisse td, #ergebnisse th { font-size:13px; }
  .zustand { padding:8px 12px; border-radius:6px; margin-bottom:10px; font-weight:600; }
  .zustand.liegt { background:#fff3e0; color:var(--warn); }
  .zustand.weg { background:#e6f4ea; color:var(--ok); }
  .anriss { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:13px; color:var(--grau); margin-bottom:10px; }
  .anriss input[type=range] { flex:1; min-width:140px; }
  .anriss output { min-width:64px; font-variant-numeric:tabular-nums; color:var(--text); }
  @media (max-width: 900px) { main { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>labinett · Nikolo-Glücksscheibe</h1>
  <span class="status" id="kopfstatus">…</span>
</header>
<main>
  <section>
    <h2>Kamera</h2>
    <img id="live" alt="Live-Bild" hidden>
    <div id="keinekamera" class="leer" style="background:#333;color:#bbb;border-radius:6px">Kein Kamerabild – Foto laden geht trotzdem.</div>
    <div class="leiste">
      <button id="btnAufnehmen" class="primaer">Jetzt aufnehmen</button>
      <label><input type="file" id="datei" accept="image/*" hidden><button onclick="document.getElementById('datei').click()">Foto laden …</button></label>
      <div class="balken" title="Karte liegt ruhig"><div id="stabil"></div></div>
    </div>
    <div class="leiste" id="fokusleiste" title="Bildschärfe der Webcam – wirkt sofort und wird gespeichert">
      <label for="fokus">Fokus</label>
      <input type="range" id="fokus" min="0" max="255" step="1" style="flex:1;min-width:120px">
      <input type="number" id="fokuszahl" min="0" max="4095" style="width:70px;font:inherit;padding:3px 5px">
      <button id="btnAutofokus" title="Autofokus kurz arbeiten lassen und den Wert dann festhalten">Autofokus</button>
    </div>
    <div class="leiste" id="belichtungsleiste" title="Belichtungszeit der Webcam – bei Ringlicht kürzer stellen (z. B. −8). Wirkt sofort und wird gespeichert.">
      <label for="belichtung">Belichtung</label>
      <input type="range" id="belichtung" min="-13" max="-1" step="1" style="flex:1;min-width:120px">
      <input type="number" id="belichtungzahl" style="width:70px;font:inherit;padding:3px 5px">
      <button id="btnAutobelichtung" title="Belichtung wieder der Kamera überlassen">Auto</button>
    </div>
    <p id="kamerainfo" class="hinweis"></p>

    <h2 style="margin-top:18px">Letzte Ergebnisse</h2>
    <table id="ergebnisse"><thead><tr><th>Zeit</th><th>Nr.</th><th>Schüsse</th><th>Gesamt</th><th>Status</th></tr></thead><tbody></tbody></table>
    <p class="hinweis" id="csvpfad"></p>

    <details>
      <summary>Einstellungen</summary>
      <div class="einst" id="einst"></div>
      <div class="leiste">
        <button id="btnEinst">Speichern</button>
        <button id="btnCsvDialog" title="Ort der CSV-Datei auswählen">CSV-Datei wählen …</button>
        <button id="btnTreiber" title="Fokus, Belichtung usw. im Treiber der Webcam einstellen">Kamera-Treiber …</button>
        <span id="einstinfo" class="hinweis"></span>
      </div>
    </details>
  </section>

  <section id="auswertung">
    <h2>Auswertung</h2>
    <div class="anriss" title="Verschiebt die Grenze, ab der ein Loch eine Linie berührt. Wirkt sofort auf die angezeigte Karte und wird gespeichert.">
      <label for="anriss">Anriss-Toleranz (negativ = strenger, positiv = großzügiger)</label>
      <input type="range" id="anriss" min="-0.8" max="1.6" step="0.05" value="0">
      <output id="anrisswert">0,00 mm</output>
      <button id="btnAnrissNull" title="Auf 0 zurücksetzen">0</button>
    </div>
    <div id="kartenzustand" class="zustand" hidden></div>
    <div id="inhalt" class="leer">Karte unter die Kamera legen – die Aufnahme startet automatisch, sobald sie ruhig liegt.</div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let aktuellerEntwurf = null;   // Zeitstempel des angezeigten Entwurfs
let angezeigterEntwurf = null; // Zeitstempel des zuletzt gezeichneten Entwurfs (für Neu-Wertung)
let streamGestartet = false;
let csvWarteteVorher = false;

async function api(pfad, opt = {}) {
  const r = await fetch(pfad, opt);
  const daten = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(daten.detail || r.statusText);
  return daten;
}

function zeigeEntwurf(e) {
  const k = e.karte;
  const zeilen = k.schuesse.map((s) => `
    <tr class="${s.unsicher ? 'unsicher' : ''}">
      <td>${s.nr}</td>
      <td><input data-nr="${s.nr}" value="${s.felder.join('+')}" placeholder="außen = leer"></td>
      <td>${s.anriss ? 'ja' : 'nein'}</td>
      <td class="wert">${s.wert}</td>
    </tr>`).join('');
  const fehlend = Math.max(0, 5 - k.schuesse.length);
  const extra = Array.from({length: fehlend}, (_, i) => `
    <tr class="unsicher"><td>${k.schuesse.length + i + 1}</td>
    <td><input data-nr="${k.schuesse.length + i + 1}" value="" placeholder="nicht erkannt"></td><td></td><td class="wert">0</td></tr>`).join('');
  const gruende = (k.gruende_pruefen || []).filter((g) => !g.startsWith('Schützennummer'));
  const mitNummer = e.nummer_erfassen !== false;
  // Bei Neu-Wertung (Anriss-Regler) Eingaben des Bedieners behalten
  const behalten = e.id === angezeigterEntwurf
    ? {nummer: $('nummer') ? $('nummer').value : null, bemerkung: $('bemerkung') ? $('bemerkung').value : ''} : null;
  angezeigterEntwurf = e.id;
  $('inhalt').className = '';
  $('inhalt').innerHTML = `
    <div class="entwurf" ${mitNummer ? '' : 'style="grid-template-columns:1fr"'}>
      <img class="haupt" src="${e.bild}" alt="Erkannte Schüsse">
      ${mitNummer ? `<div class="nummer">
        ${e.nummer_bild ? `<img src="${e.nummer_bild}" alt="Schützennummer">` : ''}
        <input id="nummer" value="${k.schuetzennummer || ''}" placeholder="Nr." inputmode="numeric" maxlength="3" autocomplete="off">
      </div>` : ''}
    </div>
    <table>
      <thead><tr><th>#</th><th>Felder</th><th>Anriss</th><th>Wert</th></tr></thead>
      <tbody id="schuesse">${zeilen}${extra}</tbody>
    </table>
    <div class="gesamt">Gesamt: <span id="summe">${k.gesamt}</span> Punkte</div>
    ${gruende.length ? `<p class="hinweis">Bitte prüfen: ${gruende.join(' · ')}</p>` : ''}
    ${(e.hinweise || []).length ? `<p class="hinweis">${e.hinweise.join(' · ')}</p>` : ''}
    <div class="leiste">
      <input id="bemerkung" placeholder="Bemerkung (optional)" style="flex:1;padding:7px">
      <button id="btnSpeichern" class="primaer">Speichern (Enter)</button>
      <button id="btnVerwerfen">Verwerfen</button>
    </div>
    <p id="meldung" class="fehler"></p>`;
  document.querySelectorAll('#schuesse input').forEach((i) => i.addEventListener('input', neuSumme));
  $('btnSpeichern').onclick = speichern;
  $('btnVerwerfen').onclick = verwerfen;
  if (behalten) {
    if ($('nummer') && behalten.nummer !== null) $('nummer').value = behalten.nummer;
    $('bemerkung').value = behalten.bemerkung;
  } else ($('nummer') || $('btnSpeichern')).focus();
}

function feldwerte(text) {
  return text.split(/[+,\s]+/).filter(Boolean).map(Number);
}

function neuSumme() {
  let summe = 0;
  document.querySelectorAll('#schuesse tr').forEach((tr) => {
    const w = feldwerte(tr.querySelector('input').value).reduce((a, b) => a + (b || 0), 0);
    tr.querySelector('.wert').textContent = w;
    summe += w;
  });
  $('summe').textContent = summe;
}

async function speichern() {
  const felder = [...document.querySelectorAll('#schuesse input')].map((i) => i.value);
  try {
    const r = await api('/api/speichern', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({schuetzennummer: $('nummer') ? $('nummer').value : '', felder, bemerkung: $('bemerkung').value}),
    });
    leeren();
    if (!r.csv_gespeichert) {
      $('inhalt').innerHTML = `<span class="fehler">CSV-Datei gesperrt oder nicht erreichbar (in Excel geöffnet?). ` +
        `Ergebnis ist vorgemerkt (${r.csv_ausstehend} offen) und wird automatisch nachgetragen, sobald die Datei frei ist.</span>`;
    }
    ladeErgebnisse();
  } catch (err) { $('meldung').textContent = err.message; if ($('nummer')) { $('nummer').focus(); $('nummer').select(); } }
}

async function verwerfen() {
  await api('/api/verwerfen', {method: 'POST'});
  leeren();
}

function leeren() {
  aktuellerEntwurf = null;
  angezeigterEntwurf = null;
  $('inhalt').className = 'leer';
  $('inhalt').textContent = 'Nächste Karte unter die Kamera legen.';
}

document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter' && $('btnSpeichern')) { ev.preventDefault(); speichern(); }
  if (ev.key === 'Escape' && $('btnVerwerfen')) { ev.preventDefault(); verwerfen(); }
});

$('btnAufnehmen').onclick = async () => {
  try { const e = await api('/api/aufnehmen', {method: 'POST'}); aktuellerEntwurf = e.id; zeigeEntwurf(e); }
  catch (err) { $('kamerainfo').textContent = err.message; }
};

// ---- Fokus: Regler wirkt sofort (leicht verzögert, damit nicht jeder Pixel einen Request auslöst)
let fokusBedient = 0;          // Zeitpunkt der letzten Bedienung – solange nicht vom Status überschreiben
let fokusTimer = null;
function fokusSenden(wert) {
  fokusBedient = Date.now();
  clearTimeout(fokusTimer);
  fokusTimer = setTimeout(async () => {
    try {
      await api('/api/kamera/fokus', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({wert})});
      if ($('e_kamera_fokus')) $('e_kamera_fokus').value = wert;
    } catch (err) { $('kamerainfo').textContent = err.message; }
  }, 150);
}
function fokusAnzeigen(wert) {
  if (wert > +$('fokus').max) $('fokus').max = Math.ceil(wert / 255) * 255;  // Kameras mit größerem Bereich
  $('fokus').value = wert; $('fokuszahl').value = wert;
}
$('fokus').oninput = () => { $('fokuszahl').value = $('fokus').value; fokusSenden(+$('fokus').value); };
$('fokuszahl').onchange = () => { const w = Math.max(0, Math.round(+$('fokuszahl').value || 0)); fokusAnzeigen(w); fokusSenden(w); };
$('btnAutofokus').onclick = () => fokusSenden(-1);

// ---- Belichtung: wie Fokus, null = Automatik der Kamera
let belichtungBedient = 0;
let belichtungTimer = null;
function belichtungSenden(wert) {
  belichtungBedient = Date.now();
  clearTimeout(belichtungTimer);
  belichtungTimer = setTimeout(async () => {
    try { await api('/api/kamera/belichtung', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({wert})}); }
    catch (err) { $('kamerainfo').textContent = err.message; }
  }, 150);
}
$('belichtung').oninput = () => { $('belichtungzahl').value = $('belichtung').value; belichtungSenden(+$('belichtung').value); };
$('belichtungzahl').onchange = () => {
  const w = Math.min(+$('belichtung').max, Math.max(+$('belichtung').min, Math.round(+$('belichtungzahl').value || 0)));
  $('belichtung').value = w; $('belichtungzahl').value = w; belichtungSenden(w);
};
$('btnAutobelichtung').onclick = () => belichtungSenden(null);
function belichtungAnzeigen(k) {
  const [lo, hi] = k.belichtung_bereich || [-13, -1];
  $('belichtung').min = lo; $('belichtung').max = hi;
  $('btnAutobelichtung').classList.toggle('primaer', k.belichtung_fest == null);
  if (Date.now() - belichtungBedient < 2000 || document.activeElement === $('belichtungzahl')) return;
  const w = k.belichtung_fest ?? k.belichtung;
  if (w != null) { $('belichtung').value = w; $('belichtungzahl').value = Math.round(w); }
}

// ---- Anriss-Toleranz: Regler wertet den offenen Entwurf sofort neu
let anrissTimer = null;
const mmText = (w) => (w > 0 ? '+' : '') + w.toFixed(2).replace('.', ',') + ' mm';
function anrissAnzeigen(wert) { $('anriss').value = wert; $('anrisswert').textContent = mmText(+wert); }
function anrissSenden(wert) {
  $('anrisswert').textContent = mmText(wert);
  clearTimeout(anrissTimer);
  anrissTimer = setTimeout(async () => {
    try {
      const r = await api('/api/anriss-toleranz', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({wert})});
      if (r.entwurf && r.entwurf.id === aktuellerEntwurf) zeigeEntwurf(r.entwurf);
    } catch (err) { $('kamerainfo').textContent = err.message; }
  }, 60);
}
$('anriss').oninput = () => anrissSenden(+$('anriss').value);
$('btnAnrissNull').onclick = () => { anrissAnzeigen(0); anrissSenden(0); };

$('datei').onchange = async (ev) => {
  const f = ev.target.files[0]; if (!f) return;
  const fd = new FormData(); fd.append('datei', f);
  try { const e = await api('/api/bild', {method: 'POST', body: fd}); aktuellerEntwurf = e.id; zeigeEntwurf(e); }
  catch (err) { $('kamerainfo').textContent = err.message; }
  ev.target.value = '';
};

async function poll() {
  try {
    const s = await api('/api/status');
    const k = s.kamera;
    const u = s.update || {};
    const upd = u.zustand === 'bereit' ? ` · Update ${u.version} bereit – wird beim nächsten Start installiert`
      : u.zustand === 'laedt' ? ` · lade Update ${u.version} …` : '';
    $('kopfstatus').textContent = `v${s.version} · Kamera ${k.kamera_ok ? 'bereit' + (k.fps ? ` (${Math.round(k.fps)} Bilder/s)` : '') : 'nicht verfügbar'}${upd}`;
    const offen = s.csv_ausstehend ? ` · ${s.csv_ausstehend} Ergebnis(se) warten – Datei in Excel geöffnet?` : '';
    $('csvpfad').textContent = 'CSV: ' + s.csv + offen + (s.csv_fehler ? ' · ' + s.csv_fehler : '');
    $('csvpfad').className = offen || s.csv_fehler ? 'fehler' : 'hinweis';
    if (offen && !csvWarteteVorher) csvWarteteVorher = true;
    else if (!offen && csvWarteteVorher) { csvWarteteVorher = false; ladeErgebnisse(); }
    $('kamerainfo').textContent = k.fehler && k.fehler !== 'deaktiviert' ? k.fehler : (s.meldung || (k.wartet_auf_neue_karte ? 'Aufgenommen – Karte wegnehmen für die nächste.' : ''));
    $('fokusleiste').hidden = !k.kamera_ok;
    $('belichtungsleiste').hidden = !k.kamera_ok;
    if (k.kamera_ok) belichtungAnzeigen(k);
    if (k.fokus != null && k.fokus >= 0 && Date.now() - fokusBedient > 2000 && document.activeElement !== $('fokuszahl')) fokusAnzeigen(Math.round(k.fokus));
    $('btnAutofokus').classList.toggle('primaer', !!k.autofokus);
    $('stabil').style.width = Math.round((k.stabil || 0) * 100) + '%';
    if ((k.ausgebrannt || 0) > 0.05 && !k.fehler) {
      const regelt = k.festgehalten && k.festgehalten.belichtung;
      $('kamerainfo').textContent = 'Bild überbelichtet' + (regelt && k.belichtung != null ? ` (Belichtung ${k.belichtung}) – wird nachgeregelt` : '') +
        ' – Regler „Belichtung“ nach links schieben (z. B. −8).';
    }
    kartenzustand(k);
    if (k.kamera_ok && !streamGestartet) { $('live').src = '/stream.mjpg'; $('live').hidden = false; $('keinekamera').hidden = true; streamGestartet = true; }
    if (s.entwurf && s.entwurf.id !== aktuellerEntwurf) {
      aktuellerEntwurf = s.entwurf.id;
      const e = await api('/api/entwurf');  // Bild nur bei neuem Entwurf laden
      if (e && e.id === aktuellerEntwurf) zeigeEntwurf(e);
    }
  } catch (_) { $('kopfstatus').textContent = 'Verbindung zum Programm verloren'; }
  setTimeout(poll, 150);  // kurz halten: neue Auswertung erscheint sonst spürbar verzögert
}

// ---- Karte liegt / wurde weggenommen
let letzteEntnahmen = null;
function kartenzustand(k) {
  const z = $('kartenzustand');
  const entnommen = letzteEntnahmen !== null && k.entnahmen > letzteEntnahmen;
  letzteEntnahmen = k.entnahmen ?? letzteEntnahmen;
  if (entnommen && $('btnSpeichern')) {
    const zuPruefen = document.querySelector('#schuesse tr.unsicher') || $('inhalt').querySelector('.hinweis');
    if (einstellungen.beim_entnehmen_speichern && !zuPruefen) { speichern(); z.textContent = 'Karte weggenommen – Ergebnis gespeichert.'; }
    else z.textContent = 'Karte weggenommen – Ergebnis noch prüfen und mit Enter speichern.';
    z.className = 'zustand weg'; z.hidden = false;
  } else if (entnommen) {
    z.textContent = 'Karte weggenommen – bereit für die nächste.'; z.className = 'zustand weg'; z.hidden = false;
  } else if (k.wartet_auf_neue_karte) {
    z.textContent = 'Aufgenommen – Karte jetzt wegnehmen.'; z.className = 'zustand liegt'; z.hidden = false;
  } else if (k.karte_erkannt && z.classList.contains('weg')) {
    z.hidden = true;  // nächste Karte liegt
  }
}

async function ladeErgebnisse() {
  const rows = await api('/api/ergebnisse');
  $('ergebnisse').querySelector('tbody').innerHTML = rows.map((r) => `
    <tr><td>${r.zeitstempel.slice(11, 19)}</td><td>${r.schuetzennummer || '–'}</td>
    <td>${[1,2,3,4,5].map((n) => r['s' + n + '_wert'] || '–').join(' · ')}</td>
    <td><b>${r.gesamt}</b></td><td><span class="badge ${r.status}">${r.status}</span></td></tr>`).join('')
    || '<tr><td colspan="5" class="leer">Noch keine Ergebnisse</td></tr>';
}

const EINST = [
  ['csv_pfad', 'CSV-Datei'], ['nummer_erfassen', 'Schützennummer erfassen', 'ja'],
  ['nummer_lesen', 'Schützennummer automatisch lesen (wenn erfasst)', 'ja'],
  ['nummern_sammeln', 'Nummern-Ausschnitte sammeln (Ordner „nummern“)', 'ja'],
  ['nummer_min', 'Schützennummer von'], ['nummer_max', 'Schützennummer bis'],
  ['kamera_index', 'Kamera-Nr.'], ['kamera_mjpg', 'MJPG-Format (mehr Bilder/s)', 'ja'],
  ['kamera_festhalten', 'Fokus festhalten', 'ja'],
  ['belichtung_festhalten', 'Auch Belichtung/Weißabgleich festhalten (kann überbelichten)', 'ja'],
  ['belichtung_regeln', 'Festgehaltene Belichtung nachregeln, wenn das Bild ausbrennt', 'ja'],
  ['beim_entnehmen_speichern', 'Beim Wegnehmen der Karte automatisch speichern (nur ohne „prüfen“)', 'ja'],
  ['kamera_fokus', 'Fester Fokus (−1 = automatisch ermittelt, Regler oben wirkt sofort)'],
  ['stabile_frames', 'Ruhe-Frames bis Aufnahme'], ['stabil_toleranz', 'Ruhe-Toleranz (Anteil der Raute)'],
  ['aufnahme_bilder', 'Bilder je Aufnahme (Abstimmung)'],
  ['linienbreite_mm', 'Linienbreite (mm)'], ['toleranz_mm', 'Unsicher-Toleranz (mm)'],
  ['auto_update', 'Beim Start nach Updates suchen', 'ja'],
];
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
let einstellungen = {};
async function ladeEinstellungen() {
  const e = await api('/api/einstellungen');
  einstellungen = e;
  anrissAnzeigen(e.anriss_toleranz_mm || 0);
  $('einst').innerHTML = EINST.map(([k, l, typ]) => typ === 'ja'
    ? `<label for="e_${k}">${l}</label><input id="e_${k}" type="checkbox" ${e[k] ? 'checked' : ''} style="justify-self:start">`
    : `<label for="e_${k}">${l}</label><input id="e_${k}" value="${esc(e[k])}">`).join('');
}
$('btnCsvDialog').onclick = async () => {
  $('einstinfo').textContent = 'Dateidialog ist am Auswerte-PC geöffnet …';
  try {
    const r = await api('/api/csv-dialog', {method: 'POST'});
    if (r.pfad) { $('e_csv_pfad').value = r.pfad; $('einstinfo').textContent = 'Pfad übernommen – „Speichern“ klicken.'; }
    else $('einstinfo').textContent = 'Kein Pfad gewählt.';
  } catch (err) { $('einstinfo').textContent = err.message; }
};
$('btnTreiber').onclick = async () => {
  try { await api('/api/kamera/treiber', {method: 'POST'}); $('einstinfo').textContent = 'Treiber-Dialog geöffnet (falls die Kamera einen hat).'; }
  catch (err) { $('einstinfo').textContent = err.message; }
};
$('btnEinst').onclick = async () => {
  const daten = Object.fromEntries(EINST.map(([k, , typ]) => [k, typ === 'ja' ? $('e_' + k).checked : $('e_' + k).value]));
  try { const r = await api('/api/einstellungen', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(daten)}); $('einstinfo').textContent = r.hinweis; Object.assign(einstellungen, daten); }
  catch (err) { $('einstinfo').textContent = err.message; }
};

poll(); ladeErgebnisse(); ladeEinstellungen();
</script>
</body>
</html>
